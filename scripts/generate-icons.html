<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<h1>PWA Icon Generator</h1>
<p>Right-click each image and "Save image as..." to save the icons.</p>

<h2>192x192</h2>
<canvas id="c192" width="192" height="192"></canvas>
<br><a id="dl192" download="icon-192x192.png">Download 192x192</a>

<h2>512x512</h2>
<canvas id="c512" width="512" height="512"></canvas>
<br><a id="dl512" download="icon-512x512.png">Download 512x512</a>

<h2>Maskable 512x512 (with padding)</h2>
<canvas id="cmask" width="512" height="512"></canvas>
<br><a id="dlmask" download="icon-maskable-512x512.png">Download Maskable 512x512</a>

<h2>Apple Touch Icon 180x180</h2>
<canvas id="capple" width="180" height="180"></canvas>
<br><a id="dlapple" download="apple-touch-icon.png">Download Apple Touch Icon</a>

<script>
const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#F3E8FF" />
  <polygon points="32,10 52,21 32,32 12,21" fill="url(#cubeTop)" stroke="#6B21A8" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="12,21 32,32 32,54 12,43" fill="url(#cubeLeft)" stroke="#6B21A8" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="32,32 52,21 52,43 32,54" fill="url(#cubeRight)" stroke="#6B21A8" stroke-width="1.5" stroke-linejoin="round" />
  <text x="32" y="39" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FEF08A" text-anchor="middle">×</text>
  <polygon points="50,14 55,20 50,26 45,20" fill="url(#emerald)" stroke="#047857" stroke-width="1" />
</svg>`;

function renderIcon(canvasId, linkId, size, maskable = false) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const blob = new Blob([svgString], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  
  img.onload = () => {
    if (maskable) {
      // Maskable: fill background, then draw icon in safe zone (80% center)
      ctx.fillStyle = '#9333EA';
      ctx.fillRect(0, 0, size, size);
      const padding = size * 0.1;
      const iconSize = size * 0.8;
      ctx.drawImage(img, padding, padding, iconSize, iconSize);
    } else {
      ctx.drawImage(img, 0, 0, size, size);
    }
    const link = document.getElementById(linkId);
    link.href = canvas.toDataURL('image/png');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

renderIcon('c192', 'dl192', 192);
renderIcon('c512', 'dl512', 512);
renderIcon('cmask', 'dlmask', 512, true);
renderIcon('capple', 'dlapple', 180);
</script>
</body>
</html>
