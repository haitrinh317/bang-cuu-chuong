<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="32" r="30" fill="#F3E8FF" />
  <!-- Isometric Cube -->
  <!-- Top Face -->
  <polygon points="32,10 52,21 32,32 12,21" fill="url(#cubeTop)" stroke="#6B21A8" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Left Face -->
  <polygon points="12,21 32,32 32,54 12,43" fill="url(#cubeLeft)" stroke="#6B21A8" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Right Face -->
  <polygon points="32,32 52,21 52,43 32,54" fill="url(#cubeRight)" stroke="#6B21A8" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Star / Math Sparkle -->
  <text x="32" y="27" font-family="Fredoka, sans-serif" font-size="12" font-weight="bold" fill="#FEF08A" text-anchor="middle">✖️</text>
  <!-- Mini Floating Emerald -->
  <polygon points="50,14 55,20 50,26 45,20" fill="url(#emerald)" stroke="#047857" stroke-width="1" />
</svg>
